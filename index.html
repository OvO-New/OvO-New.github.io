<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Love</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #04010a;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, rgba(90, 10, 60, .42) 0%, rgba(45, 5, 38, .28) 40%, transparent 72%),
      radial-gradient(ellipse 90% 65% at 50% 108%, rgba(35, 6, 45, .85) 0%, transparent 65%),
      radial-gradient(circle at 50% 42%, #10041a 0%, #07010e 50%, #020004 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene { position: fixed; inset: 0; z-index: 0; display: block; }

  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 44%, transparent 40%, rgba(0, 0, 0, .62) 100%);
  }

  .overlay {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 26px calc(env(safe-area-inset-bottom, 0px) + 7vh);
    display: flex; flex-direction: column; align-items: center; text-align: center;
    pointer-events: none; user-select: none;
  }

  .name-glow {
    filter: drop-shadow(0 0 24px rgba(255, 62, 122, .85))
            drop-shadow(0 0 55px rgba(255, 30, 100, .45));
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }

  .name-wrap { opacity: 0; animation: fadeUp 2.4s cubic-bezier(.16, 1, .3, 1) .45s forwards; }

  .name {
    display: block; font-size: clamp(2.3rem, 8.2vw, 4.4rem); font-weight: 700;
    letter-spacing: .22em; text-indent: .22em; line-height: 1.25;
    background: linear-gradient(100deg, #ffe6f2 0%, #ffa8c8 18%, #ff3f7e 42%, #ff1e63 52%, #ff3f7e 62%, #ffa8c8 84%, #ffe6f2 100%);
    background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5.5s linear infinite;
  }

  .sub {
    margin-top: 1.5rem; font-size: clamp(.92rem, 3.5vw, 1.28rem);
    letter-spacing: .42em; text-indent: .42em; font-weight: 400;
    color: rgba(255, 216, 234, .96);
    text-shadow: 0 0 20px rgba(255, 80, 140, .8), 0 0 45px rgba(255, 40, 110, .5);
    opacity: 0; animation: fadeUp 2s cubic-bezier(.16, 1, .3, 1) 1.6s forwards;
  }

  .sub2 {
    margin-top: 1.05rem; font-size: clamp(.68rem, 2.7vw, .92rem);
    letter-spacing: .26em; text-indent: .26em; font-weight: 300;
    color: rgba(255, 186, 213, .66);
    text-shadow: 0 0 16px rgba(255, 70, 130, .5);
    opacity: 0; animation: fadeUp 2s cubic-bezier(.16, 1, .3, 1) 2.6s forwards;
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(28px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 260% 50%; }
  }

  @media (max-height: 620px) {
    .overlay { padding-bottom: 3.5vh; }
    .sub2 { display: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="vignette"></div>

<div class="overlay">
  <div class="name-glow"><div class="name-wrap"><span class="name">林瑶卿</span></div></div>
  <p class="sub">爱 你 喵</p>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1, isMobile = false, minDim = 0;

  /* =====================================================
     尺寸 / 清晰度
     - 按设备像素比渲染（移动端最高 3x，桌面 2.5x）
     - 同时限制总像素预算，避免高分辨率下掉帧
  ===================================================== */
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    isMobile = Math.min(W, H) < 720;
    minDim = Math.min(W, H);

    const rawDpr = window.devicePixelRatio || 1;
    const MAX_PIXELS = isMobile ? 4.0e6 : 8.0e6;

    let dpr = Math.min(rawDpr, isMobile ? 3 : 2.5);
    const budget = Math.sqrt(MAX_PIXELS / Math.max(1, W * H));
    if (budget < dpr) dpr = Math.max(1, budget);

    DPR = dpr;

    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  /* =====================================================
     心形参数方程（y 翻转，尖角朝下）
     ★ 关键修复：整体做包围盒居中，
       使心形几何中心与爆炸点重合，避免内部填充
       与轮廓错位（看起来像两颗半心叠在一起）
  ===================================================== */
  const HEART_CY = 2.54;   // 原始曲线 y 包围盒中心偏移
  const HEART_HX = 16;     // 半宽
  const HEART_HY = 14.46;  // 半高（居中后）

  function heartPoint(t) {
    const s = Math.sin(t);
    return [
      16 * s * s * s,
      -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - HEART_CY
    ];
  }

  /* ---- 轮廓按「弧长」均匀采样，避免凹口/尖端扎堆 ---- */
  const OUTLINE_LUT = (function () {
    const N = 1024;
    const data = new Float64Array((N + 1) * 3); // x, y, 累计弧长
    let acc = 0, px = 0, py = 0;
    for (let i = 0; i <= N; i++) {
      const p = heartPoint((i / N) * Math.PI * 2);
      if (i > 0) acc += Math.hypot(p[0] - px, p[1] - py);
      data[i * 3]     = p[0];
      data[i * 3 + 1] = p[1];
      data[i * 3 + 2] = acc;
      px = p[0]; py = p[1];
    }
    return { data: data, n: N + 1, total: acc };
  })();

  function sampleOutline(u) {
    const data = OUTLINE_LUT.data;
    const n = OUTLINE_LUT.n;
    const target = (u % 1) * OUTLINE_LUT.total;
    let lo = 0, hi = n - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (data[mid * 3 + 2] < target) lo = mid + 1;
      else hi = mid;
    }
    return [data[lo * 3], data[lo * 3 + 1]];
  }

  /* ---- 心形内部均匀取点（拒绝采样） ---- */
  const HEART_POLY = (function () {
    const N = 220, poly = [];
    for (let i = 0; i < N; i++) poly.push(heartPoint((i / N) * Math.PI * 2));
    return poly;
  })();

  function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      if (((yi > y) !== (yj > y)) &&
          (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function randomPointInHeart(scale) {
    const bx = HEART_HX * scale;
    const by = HEART_HY * scale;
    for (let k = 0; k < 16; k++) {
      const x = (Math.random() * 2 - 1) * bx;
      const y = (Math.random() * 2 - 1) * by;
      if (pointInPoly(x, y, HEART_POLY)) return [x, y];
    }
    return [0, 0];
  }

  /* =====================================================
     预渲染光点精灵（白核 + 彩色光晕）
     - 分辨率提到 96，缩放绘制更细腻
     - 核心更锐利，光晕收敛 → 整体更"清晰"
  ===================================================== */
  const SPRITE_HUES = [335, 350, 318, 288, 45, 300, 0];
  const spriteMap = {};

  (function buildSprites() {
    const S = 96, R = S / 2;
    for (let k = 0; k < SPRITE_HUES.length; k++) {
      const hue = SPRITE_HUES[k];
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(R, R, 0, R, R, R);
      grd.addColorStop(0.00, 'rgba(255,255,255,1)');
      grd.addColorStop(0.10, 'hsla(' + hue + ',100%,95%,1)');
      grd.addColorStop(0.24, 'hsla(' + hue + ',100%,80%,0.58)');
      grd.addColorStop(0.48, 'hsla(' + hue + ',100%,68%,0.13)');
      grd.addColorStop(0.75, 'hsla(' + hue + ',100%,62%,0.035)');
      grd.addColorStop(1.00, 'hsla(' + hue + ',100%,58%,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, S, S);
      spriteMap[hue] = c;
    }
  })();

  function getSprite(hue) {
    let best = SPRITE_HUES[0], bd = 999;
    for (let i = 0; i < SPRITE_HUES.length; i++) {
      const d = Math.abs(SPRITE_HUES[i] - hue);
      if (d < bd) { bd = d; best = SPRITE_HUES[i]; }
    }
    return spriteMap[best];
  }

  /* =====================================================
     背景星光
  ===================================================== */
  const stars = [];
  (function initStars() {
    const N = isMobile ? 60 : 100;
    for (let i = 0; i < N; i++) {
      stars.push({
        x: Math.random(), y: Math.random(),
        size: 0.4 + Math.random() * 1.3,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 2
      });
    }
  })();

  function drawStars(T) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const a = 0.08 + 0.38 * (0.5 + 0.5 * Math.sin(T * s.speed + s.phase));
      ctx.globalAlpha = a;
      ctx.fillStyle = 'hsl(330,100%,90%)';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* =====================================================
     烟花系统
  ===================================================== */
  const rockets = [];
  const particles = [];
  const flashes = [];

  const MAX_PARTICLES = isMobile ? 640 : 1040;
  const MAIN_HUES = [335, 350, 318, 288, 300];
  const GOLD_HUE = 45;

  function pickHue() {
    if (Math.random() < 0.18) return GOLD_HUE;
    return MAIN_HUES[(Math.random() * MAIN_HUES.length) | 0];
  }

  function launchRocket(sx, sy, forcedTargetY) {
    const x = sx !== undefined ? sx : W * (0.18 + Math.random() * 0.64);
    const y = sy !== undefined ? sy : H + 24;
    const targetY = forcedTargetY !== undefined
      ? forcedTargetY
      : H * (0.10 + Math.random() * 0.30);

    const tEnd = 0.95 + Math.random() * 0.45;
    const g = 2 * (y - targetY) / (tEnd * tEnd);
    const vy = -g * tEnd;

    rockets.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 26,
      vy: vy,
      g: g,
      hue: pickHue(),
      trail: []
    });
  }

  function explode(x, y, hue) {
    // 爆炸闪光
    flashes.push({
      x: x, y: y,
      r: 0,
      maxR: minDim * 0.16,
      life: 1,
      hue: hue
    });

    const outlineN = isMobile ? 64 : 88;
    const innerN   = isMobile ? 18 : 26;
    const speedK   = minDim * 0.0215;

    /* ---- 爱心轮廓：弧长均匀采样，形状完整对称 ---- */
    for (let i = 0; i < outlineN; i++) {
      const hp = sampleOutline(i / outlineN);
      const j = 0.93 + Math.random() * 0.14;   // 轻微厚度

      const pvx = hp[0] * speedK * j;
      const pvy = hp[1] * speedK * j;

      const pHue = hue + (Math.random() - 0.5) * 22;

      particles.push({
        x: x + (Math.random() - 0.5) * 2,
        y: y + (Math.random() - 0.5) * 2,
        px: x, py: y,
        vx: pvx, vy: pvy,
        life: 1,
        maxLife: 1.30 + Math.random() * 0.60,
        size: (isMobile ? 7 : 8) + Math.random() * 5,
        hue: pHue,
        sprite: getSprite(pHue),
        flick: Math.random() * Math.PI * 2,
        drag: 1.55 + Math.random() * 0.30
      });
    }

    /* ---- 内部填充：在心形内部均匀取点，
           与轮廓共用同一中心，形成完整实心爱心 ---- */
    for (let i = 0; i < innerN; i++) {
      const ip = randomPointInHeart(0.94);
      const j = 0.88 + Math.random() * 0.20;

      const pvx = ip[0] * speedK * j;
      const pvy = ip[1] * speedK * j;

      const pHue = hue + (Math.random() - 0.5) * 18;

      particles.push({
        x: x, y: y,
        px: x, py: y,
        vx: pvx, vy: pvy,
        life: 1,
        maxLife: 1.05 + Math.random() * 0.45,
        size: (isMobile ? 4.5 : 5.5) + Math.random() * 4,
        hue: pHue,
        sprite: getSprite(pHue),
        flick: Math.random() * Math.PI * 2,
        drag: 1.70 + Math.random() * 0.35
      });
    }

    if (particles.length > MAX_PARTICLES) {
      particles.splice(0, particles.length - MAX_PARTICLES);
    }
  }

  /* =====================================================
     更新
  ===================================================== */
  function updateRockets(dt) {
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.vy += r.g * dt;
      r.x += r.vx * dt;
      r.y += r.vy * dt;

      r.trail.push({ x: r.x, y: r.y });
      if (r.trail.length > 9) r.trail.shift();

      if (r.vy >= -18) {
        explode(r.x, r.y, r.hue);
        rockets.splice(i, 1);
      }
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      p.px = p.x;
      p.py = p.y;

      const damp = Math.exp(-p.drag * dt);
      p.vx *= damp;
      p.vy *= damp;

      p.vy += 68 * dt;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function updateFlashes(dt) {
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life -= dt * 3.2;
      f.r += (f.maxR - f.r) * Math.min(1, dt * 14);
      if (f.life <= 0) flashes.splice(i, 1);
    }
  }

  /* =====================================================
     绘制
  ===================================================== */
  function drawRockets() {
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < rockets.length; i++) {
      const r = rockets[i];
      const sprite = getSprite(r.hue);

      for (let j = 0; j < r.trail.length; j++) {
        const tp = r.trail[j];
        const k = j / r.trail.length;
        const s = 2 + k * 8;
        ctx.globalAlpha = 0.06 + k * 0.32;
        ctx.drawImage(sprite, tp.x - s / 2, tp.y - s / 2, s, s);
      }

      const s = 15;
      ctx.globalAlpha = 0.95;
      ctx.drawImage(sprite, r.x - s / 2, r.y - s / 2, s, s);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawFlashes() {
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < flashes.length; i++) {
      const f = flashes[i];
      const a = Math.max(0, f.life) * 0.55;
      if (a <= 0.01 || f.r <= 0.5) continue;

      const grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      grd.addColorStop(0.00, 'hsla(' + f.hue + ',100%,92%,' + a + ')');
      grd.addColorStop(0.35, 'hsla(' + f.hue + ',100%,76%,' + (a * 0.42) + ')');
      grd.addColorStop(1.00, 'hsla(' + f.hue + ',100%,66%,0)');

      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function drawParticles(T) {
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      const t = p.life / p.maxLife;   // 1 → 0
      if (t <= 0) continue;

      // 闪入 + 渐隐（曲线更平滑，减少"糊"感）
      let alpha;
      if (t > 0.90) {
        alpha = (1 - t) / 0.10;
      } else if (t < 0.32) {
        alpha = t / 0.32;
      } else {
        alpha = 1;
      }
      alpha *= alpha * 0.95;

      // 火花闪烁（幅度减小，画面更干净）
      const flick = 0.86 + 0.14 * Math.sin(T * 18 + p.flick);
      alpha *= flick;
      if (alpha <= 0.015) continue;

      const sizeK = 0.40 + 0.60 * t;
      const s = p.size * sizeK;

      // 极短拖尾（很淡，不拖泥带水）
      const s2 = s * 0.60;
      ctx.globalAlpha = alpha * 0.26;
      ctx.drawImage(p.sprite, p.px - s2 / 2, p.py - s2 / 2, s2, s2);

      ctx.globalAlpha = alpha;
      ctx.drawImage(p.sprite, p.x - s / 2, p.y - s / 2, s, s);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* =====================================================
     交互：点击 / 触摸直接在该点爆炸
  ===================================================== */
  let lastTap = 0;

  function handleTap(x, y) {
    const now = performance.now();
    if (now - lastTap < 90) return;
    lastTap = now;
    explode(x, y, pickHue());
  }

  window.addEventListener('pointerdown', function (e) {
    handleTap(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('touchstart', function (e) {
    if (e.touches.length > 0) {
      handleTap(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  /* =====================================================
     主循环
  ===================================================== */
  let prev = performance.now();
  const T0 = prev;
  let rocketTimer = 0.35;

  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.033);
    prev = now;
    const T = (now - T0) / 1000;

    rocketTimer -= dt;
    if (rocketTimer <= 0) {
      if (rockets.length < 5) launchRocket();
      rocketTimer = 0.62 + Math.random() * 0.85;
    }

    updateRockets(dt);
    updateParticles(dt);
    updateFlashes(dt);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawStars(T);
    drawRockets();
    drawFlashes();
    drawParticles(T);

    requestAnimationFrame(frame);
  }

  setTimeout(function () {
    launchRocket(W * 0.5, H + 24, H * 0.30);
  }, 700);

  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
